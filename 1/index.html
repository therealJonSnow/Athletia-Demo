<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preload" href="/fonts/SeasonCollectionVF-TRIAL.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/season.css">
<script>
  // Run the intro only when motion is allowed; otherwise the page shows its final state.
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('intro');

<style>
  :root {
    /* Concept 2 · navy stage, everything pink. Layout: centred mark + target band, copy and legal pinned to the bottom edge. */
    --navy: #080E17;
    --pink: #F22857;
    --pink-hot: #FF1B50;
    --pink-20: rgba(242, 40, 87, 0.20);
    --pink-30: rgba(242, 40, 87, 0.30);
    /* Season Collection (trial): Sans for body, Mix (SERF 50) for the headline. See /fonts/season.css. */
    --font-body: "Season", "Helvetica Neue", Arial, sans-serif;
    --font-display: "Season", Georgia, "Times New Roman", serif;
    --edge: clamp(16px, 2.8vw, 40px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--navy);
    color: var(--pink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; border-radius: 4px; }

  .stage {
    position: relative;
    min-height: 100%;
    display: grid;
    grid-template-rows: 1fr auto;
    overflow: hidden;
  }

  /* ---------- Centre: logo + target band ---------- */
  .centre {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(28px, 3vw, 44px);
    padding: 48px var(--edge) 24px;   /* nudges the hero ~24px above true centre, towards the gap above the copy */
  }
  .logo { width: 393px; max-width: 100%; color: var(--pink); line-height: 0; }
  .logo svg { width: 100%; height: auto; display: block; overflow: visible; }
  .sig-c { transform-box: fill-box; transform-origin: center; }

  .slot {
    position: relative;
    width: min(860px, 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .target {
    position: relative;
    width: 100%;
    display: grid;
    grid-template: minmax(0, 1fr) / minmax(0, 1fr);
    padding: 12px;
  }
  .tick { position: absolute; width: 10px; height: 10px; line-height: 0; }
  .tick svg { width: 10px; height: 10px; display: block; }
  .tick.tl { top: 1px; left: 1px; }
  .tick.br { right: 1px; bottom: 1px; transform: rotate(180deg); }

  .band {
    background: var(--pink);
    border-radius: 10px;
    display: grid;
    place-items: center;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
  }
  .band-inner { padding: 48px clamp(24px, 3.9vw, 56px); }
  .band h1 {
    margin: 0;
    color: var(--navy);
    font-family: var(--font-display);
    font-variation-settings: "SERF" 50;
    font-weight: 300;
    font-size: 56px;
    line-height: 1;
    letter-spacing: -0.015em;
    text-align: center;
    text-wrap: balance;
    padding-bottom: 0.08em;
  }
  .band h1 span { display: inline-block; }


  /* ---------- Bottom: copy, contact, legal ---------- */
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px 40px;
    flex-wrap: wrap;
    padding: 0 var(--edge) var(--edge);
  }
  .intro-copy { display: grid; gap: 24px; justify-items: start; max-width: 560px; }
  .intro-copy p { margin: 0; font-size: 22px; line-height: 1.2; }
  .intro-copy p .w { display: inline-block; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 16px;
    border-radius: 10px;
    background: var(--pink-20);
    color: var(--pink-hot);
    font-size: 18px;
    font-weight: 500;
    transition: background-color .2s ease;
  }
  .btn svg { width: 12px; height: 12px; transition: transform .2s ease; }
  .btn:hover { background: var(--pink-30); }
  .btn:hover svg { transform: translate(2px, -2px); }

  /* Contact hover: the hero's corner-tick crosshairs open around the button */
  .btn-wrap { position: relative; display: inline-flex; }
  .btn-tick { position: absolute; width: 6px; height: 6px; line-height: 0; opacity: 0; pointer-events: none;
    transition: transform .45s cubic-bezier(0.16, 1, 0.3, 1), opacity .2s ease; }
  .btn-tick svg { width: 6px; height: 6px; display: block; }
  .btn-tick.tl { top: -5px; left: -5px; transform: translate(5px, 5px); }
  .btn-tick.br { bottom: -5px; right: -5px; transform: rotate(180deg) translate(5px, 5px); }
  .btn-wrap:hover .btn-tick, .btn:focus-visible ~ .btn-tick { opacity: 1; }
  .btn-wrap:hover .btn-tick.tl, .btn:focus-visible ~ .btn-tick.tl { transform: none; }
  .btn-wrap:hover .btn-tick.br, .btn:focus-visible ~ .btn-tick.br { transform: rotate(180deg); }

  .legal { display: flex; gap: 16px; font-size: 18px; line-height: 1.2; }
  .legal .copy { opacity: .6; }
  .legal a { opacity: .7; transition: opacity .2s ease; }
  .legal a:hover { opacity: 1; }

  /* Pre-animation state (only when the intro runs) */
  .intro .sig-c,
  .intro .sig-l,
  .intro .sig-r,
  .intro .word-l,
  .intro .word-r,
  .intro .intro-copy .w,
  .intro .btn,
  .intro .legal > *,
  .intro .tick,
  .intro .band,
  .intro .band h1 span { opacity: 0; }

  @media (max-width: 720px) {
    .centre { padding-top: 72px; }
    .foot { flex-direction: column; align-items: flex-start; }
    .legal { flex-wrap: wrap; }
  }
</style>
</head>

<script>
(() => {
  const root = document.documentElement;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  // Split the subline into words so they can stagger in
  const sub = $('#subline');
  sub.innerHTML = sub.textContent.trim().split(/\s+/).map(w => `<span class="w">${w}</span>`).join(' ');

  const target = $('#target'), band = $('#band');
  const headline = $('.band h1 span');
  const logo = $('.logo'), sigC = $('.sig-c'), sigL = $('.sig-l'), sigR = $('.sig-r'), wordL = $('.word-l'), wordR = $('.word-r');
  const words = $$('#subline .w'), btn = $('.btn'), legal = $$('.legal > *'), ticks = $$('.tick');

  const outExpo = 'cubic-bezier(0.16, 1, 0.3, 1)';
  const inOut = 'cubic-bezier(0.65, 0, 0.35, 1)';
  let running = [];

  const anim = (el, frames, opts) => { const a = el.animate(frames, { fill: 'both', ...opts }); running.push(a); return a; };

  function reset() {
    running.forEach(a => a.cancel());
    running = [];
  }

  function play() {
    reset();
    if (reduce.matches) { root.classList.remove('intro'); return; }
    root.classList.add('intro');

    // The band sits at its final size the whole time, so the headline never reflows or drifts.
    // Only the corner ticks (transform) and the pink fill (clip-path) move: no layout animation.
    const finalW = target.offsetWidth, finalH = target.offsetHeight;
    const dx = finalW / 2 - 12, dy = finalH / 2 - 12;   // ticks start as a 24px box at the centre

    const gap = parseFloat(getComputedStyle($('.centre')).rowGap) || 44;
    const lift = (gap + finalH) / 2;           // logo starts centred on its own, like frame 1

    // ---- 1. Logo animates in ---------------------------------------------
    anim(logo, [{ transform: `translateY(${lift}px)` }, { transform: `translateY(${lift}px)` }], { duration: 10 });
    // Logo builds outward from the centre: square, then the signet's sides, then the words
    anim(sigC, [{ opacity: 0, transform: 'scale(0.5)' }, { opacity: 1, transform: 'none' }], { duration: 700, delay: 150, easing: outExpo });
    anim(sigL, [{ opacity: 1, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], { duration: 800, delay: 550, easing: outExpo });
    anim(sigR, [{ opacity: 1, transform: 'translateX(-24px)' }, { opacity: 1, transform: 'none' }], { duration: 800, delay: 550, easing: outExpo });
    anim(wordL, [{ opacity: 1, transform: 'translateX(190px)' }, { opacity: 1, transform: 'none' }], { duration: 1100, delay: 950, easing: outExpo });
    anim(wordR, [{ opacity: 1, transform: 'translateX(-125px)' }, { opacity: 1, transform: 'none' }], { duration: 1100, delay: 950, easing: outExpo });

    // ---- 2. One continuous move: crosshairs open, the red box fills in behind them, the text rises ----
    const T = 1300;                                    // hero starts while the words are still settling
    const glide = 'cubic-bezier(0.6, 0, 0.15, 1)';   // soft start, long settle: no stops along the way
    const D = 1700;                                    // whole expansion, ticks to final band
    anim(logo, [{ transform: `translateY(${lift}px)` }, { transform: 'translateY(0)' }], { duration: 1200, delay: T, easing: inOut });

    const S = T + 150;
    ticks.forEach(t => anim(t, [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: S, easing: 'ease-out' }));
    anim($('.tick.tl'), [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
      { duration: D, delay: S, easing: glide });
    anim($('.tick.br'), [{ transform: `translate(${-dx}px, ${-dy}px) rotate(180deg)` }, { transform: 'rotate(180deg)' }],
      { duration: D, delay: S, easing: glide });

    // Red box grows from the centre a beat behind the ticks and lands with them
    anim(band, [{ opacity: 1, clipPath: 'inset(50% 50% 50% 50% round 10px)' }, { opacity: 1, clipPath: 'inset(0% 0% 0% 0% round 10px)' }],
      { duration: D - 200, delay: S + 200, easing: glide });

    // Text rises in while the box is still settling
    anim(headline, [{ opacity: 0, transform: 'translateY(60%)' }, { opacity: 1, transform: 'none' }],
      { duration: 1000, delay: S + D * 0.55, easing: outExpo });

    // ---- 3. Lower content comes in once the hero has landed ---------------
    const L = S + D * 0.7;                              // overlaps the box landing: one continuous flow
    words.forEach((w, i) => anim(w,
      [{ opacity: 0, transform: 'translateY(0.6em)' }, { opacity: 1, transform: 'none' }],
      { duration: 900, delay: L + i * 12, easing: outExpo }));

    anim(btn, [{ opacity: 0, clipPath: 'inset(0 100% 0 0 round 10px)' }, { opacity: 1, clipPath: 'inset(0 0% 0 0 round 10px)' }],
      { duration: 700, delay: L + 150, easing: outExpo });

    legal.forEach((el, i) => anim(el,
      [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: el.classList.contains('copy') ? 0.6 : 0.7, transform: 'none' }],
      { duration: 600, delay: L + 200 + i * 50, easing: outExpo }));

    Promise.all(running.map(a => a.finished)).then(() => {
      // Hand the final state back to CSS so the page stays responsive
      running.forEach(a => a.cancel());
      running = [];
      root.classList.remove('intro');
      $$('.logo, .sig-c, .sig-l, .sig-r, .word-l, .word-r, #subline .w, .btn, .legal > *, .tick, .band, .band h1 span').forEach(el => {
        el.style.opacity = ''; el.style.transform = ''; el.style.filter = ''; el.style.clipPath = '';
      });
    }).catch(() => {});
  }

  // Wait for the webfonts so the headline is measured at its real size, but never more than 1s:
  // on a slow connection the page still animates in (with the fallback font) instead of sitting blank.
  const fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();
  Promise.race([fontsReady, new Promise(r => setTimeout(r, 1000))]).then(() => requestAnimationFrame(play));

  // The intro uses px values measured at the start. If the width changes mid-intro, jump to the end state
  // (height-only changes, like a mobile URL bar collapsing, are ignored).
  let lastW = window.innerWidth;
  window.addEventListener('resize', () => {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    running.forEach(a => a.finish());
  });
})();
</script>
<script src="/switcher.js" defer></script>
</body>
