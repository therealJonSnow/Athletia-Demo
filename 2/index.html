<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athletia Core — Intro</title>
<link rel="preload" href="/fonts/SeasonCollectionVF-TRIAL.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/season.css">
<style>
  :root {
    --bg: #080e17;
    --pink: #f22857;
    --pink-text: #ff1b50;
    --pink-20: rgba(242, 40, 87, 0.2);
    /* Season Collection (trial): Sans for body, Mix (SERF 50) for the headline. See /fonts/season.css. */
    --font-mix: "Season", Georgia, serif;
    --font-sans: "Season", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: var(--font-sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .stage { position: relative; width: 100vw; height: 100vh; height: 100svh; overflow: hidden; }

  /* Background symbol — drawn at its final (cover) size, scaled down by JS */
  .symbol {
    position: absolute;
    left: 50%; top: calc(50% + 1.5px);
    width: max(147.08vw, 235.3vh);
    aspect-ratio: 2118 / 1009;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: 50% 50%;
    pointer-events: none;
    will-change: transform;
  }
  .symbol svg { display: block; width: 100%; height: 100%; }

  /* Content stack (logo + hero), centred like the Figma frame */
  .stack {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(593px, calc(100vw - 48px));
    display: flex; flex-direction: column; align-items: center; gap: 48px;
  }
  .logo { display: block; width: 309.925px; height: 34px; overflow: visible; will-change: transform; }
  .logo .word { will-change: transform, opacity; }

  .hero { display: flex; flex-direction: column; align-items: center; gap: 32px; width: 100%; text-align: center; }
  .hero-text { display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; }
  h1 {
    width: max-content;
    font-family: var(--font-mix);
    font-variation-settings: "SERF" 50;
    font-weight: 300;
    font-size: 88px;
    line-height: 0.96;
    letter-spacing: -0.02em;
    color: #fff;
  }
  /* each line rises out of its own mask */
  h1 .line { display: block; overflow: hidden; padding-bottom: 0.14em; margin-bottom: -0.14em; }
  h1 .line > span { display: block; white-space: nowrap; will-change: transform; }
  .sub {
    width: max-content; /* line break fixed to match Figma */
    font-size: 18px; line-height: 1.4;
    color: rgba(255, 255, 255, 0.7);
  }
  .cta {
    display: inline-flex; align-items: center; justify-content: center;
    height: 44px; padding: 0 16px; border: 0; border-radius: 10px;
    background: var(--pink-20); color: var(--pink-text);
    font: 500 18px/1.2 var(--font-sans);
    cursor: pointer; text-decoration: none;
    transition: background-color .2s ease;
  }
  .cta:hover { background: rgba(242, 40, 87, 0.3); }
  .cta:focus-visible { outline: 2px solid var(--pink-text); outline-offset: 3px; }

  /* Contact hover: corner-tick crosshairs open around the button */
  .btn-wrap { position: relative; display: inline-flex; }
  .btn-tick { position: absolute; width: 6px; height: 6px; line-height: 0; opacity: 0; pointer-events: none;
    transition: transform .45s cubic-bezier(0.16, 1, 0.3, 1), opacity .2s ease; }
  .btn-tick svg { width: 6px; height: 6px; display: block; }
  .btn-tick.tl { top: -5px; left: -5px; transform: translate(5px, 5px); }
  .btn-tick.br { bottom: -5px; right: -5px; transform: rotate(180deg) translate(5px, 5px); }
  .btn-wrap:hover .btn-tick, .cta:focus-visible ~ .btn-tick { opacity: 1; }
  .btn-wrap:hover .btn-tick.tl, .cta:focus-visible ~ .btn-tick.tl { transform: none; }
  .btn-wrap:hover .btn-tick.br, .cta:focus-visible ~ .btn-tick.br { transform: rotate(180deg); }

  .legal {
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    display: flex; gap: 24px;
    font-size: 14px; color: rgba(255, 255, 255, 0.5);
  }
  .legal a { color: inherit; text-decoration: none; transition: color .2s ease; }
  .legal a:hover { color: rgba(255, 255, 255, 0.85); }

  .replay {
    position: absolute; right: 20px; bottom: 20px;
    font: 500 12px/1 var(--font-sans); letter-spacing: .02em;
    color: rgba(255,255,255,.45); background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08); border-radius: 999px;
    padding: 8px 12px; cursor: pointer; opacity: 0; transition: opacity .3s ease, color .2s ease;
  }
  .replay.show { opacity: 1; }
  .replay:hover { color: #fff; }

  /* Pre-animation state (before JS runs) */
  .js .symbol, .js .logo, .js h1, .js .hero-anim, .js .legal { opacity: 0; }
  .sig-c { transform-box: fill-box; transform-origin: center; }
</style>
</head>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const symbol = $('.symbol');
  const logo = $('.logo');
  const inner = $('.logo-inner');
  const sigC = $('.sig-c'), sigL = $('.sig-l'), sigR = $('.sig-r');
  const left = $('.word-left');
  const right = $('.word-right');
  const lines = [...document.querySelectorAll('h1 .line > span')];
  const sub = $('.sub');
  const cta = $('.btn-wrap');
  const legal = $('.legal');
  const replayBtn = $('.replay');

  // Easings
  const EXPO = 'cubic-bezier(0.87, 0, 0.13, 1)';   // big scale moves
  const OUT  = 'cubic-bezier(0.16, 1, 0.3, 1)';    // reveals
  const INOUT = 'cubic-bezier(0.65, 0, 0.35, 1)';


  // Symbol sizes per keyframe, in design px (1440×900 frame)
  const SYMBOL_START = 72;   // frame 1 — same size as the mark

  let anims = [];
  const play = (el, kf, opts) => {
    const a = el.animate(kf, { fill: 'both', ...opts });
    anims.push(a);
    return a;
  };

  function run() {
    anims.forEach(a => a.cancel());
    anims = [];
    replayBtn.classList.remove('show');
    document.documentElement.classList.remove('js');

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const finalW = symbol.getBoundingClientRect().width; // CSS state = final size
    const sStart = SYMBOL_START / finalW;
    const base = 'translate(-50%, -50%) ';

    // How far the logo must drop so it sits in the viewport centre before the hero arrives
    const stackRect = $('.stack').getBoundingClientRect();
    const logoRect = logo.getBoundingClientRect();
    const centreY = stackRect.top + stackRect.height / 2;
    const dropY = centreY - (logoRect.top + logoRect.height / 2);

    if (reduce) {
      [legal, sub, cta].forEach(el => play(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 400 }));
      replayBtn.classList.add('show');
      return;
    }

    // Timeline (ms) — every phase starts while the previous one is still settling
    const GLIDE = 'cubic-bezier(0.7, 0, 0.2, 1)';   // soft start, long settle
    const LIFT  = 'cubic-bezier(0.5, 0, 0.1, 1)';   // quicker start so the logo clears the text sooner
    const T = { full: 1400 };                        // background: small → full screen
    T.sigC  = 1050;            // logo starts as the background is settling (~75%)
    T.sides = T.sigC + 250;    // signet sides
    T.words = T.sigC + 500;    // Athletia / Core
    T.lift  = T.sigC + 1050;   // as the words settle, the logo lifts…
    T.text  = T.lift + 300;    // …and the text follows right behind it, never overlapping

    play(legal, [{ opacity: 0 }, { opacity: 1 }], { duration: 900, delay: 200, easing: 'ease-out' });

    // Background symbol: fades in while it grows, one continuous scale
    play(symbol, [
      { transform: base + `scale(${sStart})` },
      { transform: base + 'scale(1)' }
    ], { duration: T.full, easing: GLIDE });
    play(symbol, [{ opacity: 0 }, { opacity: 1 }], { duration: 300, easing: 'ease-out' });

    // Logo builds outward from the centre (Concept 2)
    play(sigC, [
      { opacity: 0, transform: 'scale(0.5)' },
      { opacity: 1, transform: 'none' }
    ], { duration: 800, delay: T.sigC, easing: OUT });
    play(sigL, [{ transform: 'translateX(19.5px)' }, { transform: 'none' }], { duration: 900, delay: T.sides, easing: OUT });
    play(sigR, [{ transform: 'translateX(-19.5px)' }, { transform: 'none' }], { duration: 900, delay: T.sides, easing: OUT });
    play(left,  [{ transform: 'translateX(145px)' }, { transform: 'none' }], { duration: 1100, delay: T.words, easing: OUT });
    play(right, [{ transform: 'translateX(-97px)' }, { transform: 'none' }], { duration: 1100, delay: T.words, easing: OUT });

    // Frame 4 → 5 — logo lifts, headline + copy + CTA come in
    play(logo, [
      { transform: `translateY(${dropY}px)` },
      { transform: 'translateY(0px)' }
    ], { duration: 1000, delay: T.lift, easing: LIFT });
    lines.forEach((l, i) => play(l, [
      { transform: 'translateY(135%)' },
      { transform: 'translateY(0%)' }
    ], { duration: 1000, delay: T.text + i * 80, easing: OUT }));
    [sub, cta].forEach((el, i) => play(el, [
      { opacity: 0, transform: 'translateY(16px)' },
      { opacity: 1, transform: 'translateY(0px)' }
    ], { duration: 900, delay: T.text + 250 + i * 100, easing: OUT }));

    Promise.all(anims.map(a => a.finished)).then(() => replayBtn.classList.add('show')).catch(() => {});
  }

  replayBtn.addEventListener('click', run);
  addEventListener('keydown', (e) => { if (e.key === 'r' && !e.metaKey && !e.ctrlKey) run(); });

  // Keep the symbol correctly sized if the window changes after the intro
  addEventListener('resize', () => {
    if (replayBtn.classList.contains('show')) {
      anims.forEach(a => a.cancel()); anims = [];
      replayBtn.classList.add('show');
    }
  });

  const start = () => requestAnimationFrame(() => requestAnimationFrame(run));
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
})();
</script>
<script src="/switcher.js" defer></script>
</body>
</html>
